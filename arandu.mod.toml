# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls.

name = "hyz-is/claude"
framework = ">= 0.50"
profiles = ["conventional", "performance"]

[permissions]
# It calls the Anthropic Messages API, through the official SDK's HTTP client,
# at api.anthropic.com or the BaseURL the application passes. Nothing else.
network = true
# It keeps nothing on disk.
filesystem = false
# It runs no other program.
exec = false
# It owns no table.
migrations = false
